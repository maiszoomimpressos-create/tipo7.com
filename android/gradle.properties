org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# URL base (com /api) pro app carregar e pra ponte nativa chamar o backend.
# Debug: aponta pro dev server na rede local — troque pelo IP da sua máquina
# (não localhost: o dispositivo/emulador não enxerga o "localhost" do PC).
# Ex: 10.0.2.2 funciona só no emulador Android; num aparelho físico (GPOS780
# de verdade) use o IP da máquina na mesma rede Wi-Fi, tipo 192.168.0.42.
TIPO7_BASE_URL_DEBUG=http://10.0.2.2:3000

# Release: domínio de produção real do site (com /api já roteado pelo
# rewrite do Next.js pro backend). AJUSTAR antes de gerar o APK de produção.
TIPO7_BASE_URL_RELEASE=https://TROCAR-PELO-DOMINIO-DE-PRODUCAO/
